<div class="verify-container" *ngIf="!loading">
  <div class="verify-box" [ngClass]="{ success: success, error: !success }">
    <h2>{{ serverMessage }}</h2>
  </div>

  <div *ngIf="success">
    <a [routerLink]="['/login']">Przejdź do logowania</a>
  </div>

  <button
    *ngIf="!success && !isResendClicked"
    type="button"
    (click)="resendCode()"
    [disabled]="isSubmitting"
  >
    <span *ngIf="!isSubmitting">Wyślij ponownie kod</span>
    <span *ngIf="isSubmitting">Wysyłanie...</span>
  </button>
</div>

<div *ngIf="loading" class="verify-loading">
  <p>Trwa weryfikacja konta...</p>
</div>
