<div class="reset-container">
  <h2>Resetowanie hasła</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="newPassword">Nowe hasło</label>
    <input
      type="password"
      id="newPassword"
      formControlName="newPassword"
      required
    />
    <div class="error" *ngIf="newPassword?.touched && newPassword?.invalid">
      Hasło musi mieć co najmniej 4 znaki
    </div>

    <label for="confirmPassword">Powtórz hasło</label>
    <input
      type="password"
      id="confirmPassword"
      formControlName="confirmPassword"
      required
    />
    <div
      class="error"
      *ngIf="form.errors?.['mismatch'] && confirmPassword?.touched"
    >
      Hasła nie są takie same
    </div>

    <button type="submit" [disabled]="isSubmitting">Zmień hasło</button>
  </form>

  <div class="message" *ngIf="message">{{ message }}</div>
  <div class="error" *ngIf="error">{{ error }}</div>
</div>
